<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Rico HTML</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}

html{scroll-behavior:smooth}

/* SCROLLBAR */

::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{
background:linear-gradient(#2aa8ff,#005eff);
border-radius:10px;
}

body{
background:#0b1220;
color:white;
overflow-x:hidden;
}

/* LOADER */

#loader{
position:fixed;
inset:0;
background:#050a16;
display:flex;
justify-content:center;
align-items:center;
z-index:999;
}

#loader:after{
content:"";
width:40px;
height:40px;
border:4px solid #2aa8ff;
border-top:4px solid transparent;
border-radius:50%;
animation:spin 1s linear infinite;
}

@keyframes spin{to{transform:rotate(360deg)}}

/* HEADER */

header{
background:rgba(5,10,22,.7);
backdrop-filter:blur(10px);
padding:15px 25px;
display:flex;
justify-content:space-between;
align-items:center;
position:sticky;
top:0;
z-index:100;
border-bottom:1px solid #ffffff10;
}

header h2{
background:linear-gradient(90deg,#2aa8ff,#00ffe7);
-webkit-background-clip:text;
color:transparent;
}

nav a{
color:white;
margin-left:20px;
text-decoration:none;
position:relative;
}

nav a:after{
content:"";
position:absolute;
left:0;
bottom:-4px;
width:0;
height:2px;
background:#2aa8ff;
transition:.3s;
}

nav a:hover:after{width:100%}

/* HERO */

.hero{
height:80vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
background:
radial-gradient(circle at top,#2aa8ff30,transparent),
linear-gradient(#0009,#0009),
url("https://images.unsplash.com/photo-1498050108023-c5249f4df085");
background-size:cover;
}

.hero h1{
font-size:50px;
animation:title 2s;
}

@keyframes title{
from{opacity:0;letter-spacing:10px}
to{opacity:1;letter-spacing:2px}
}

/* SECTIONS */

section{
padding:80px 20px;
max-width:1100px;
margin:auto;
opacity:0;
transform:translateY(50px);
transition:1s;
}

.show{opacity:1;transform:none}

/* CARDS */

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
gap:30px;
margin-top:40px;
}

.card{
background:rgba(255,255,255,.05);
backdrop-filter:blur(6px);
border:1px solid #2aa8ff40;
border-radius:20px;
overflow:hidden;
box-shadow:0 0 20px #2aa8ff20;
transition:.4s;
}

.card:hover{
transform:translateY(-12px) scale(1.02);
box-shadow:0 0 40px #2aa8ff80;
}

.card img{
width:100%;
height:160px;
object-fit:cover;
}

/* CONTACT */

.contacto{
display:grid;
grid-template-columns:1fr 1fr;
gap:40px;
}

input,textarea{
width:100%;
padding:12px;
margin-top:10px;
border-radius:8px;
border:1px solid #2aa8ff40;
background:#050a16;
color:white;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:30px;
background:linear-gradient(90deg,#2aa8ff,#005eff);
color:white;
cursor:pointer;
box-shadow:0 0 15px #2aa8ff;
}

button:hover{opacity:.8}

/* FLOATING */

.whatsapp{
position:fixed;
right:20px;
bottom:20px;
background:#25d366;
padding:15px;
border-radius:50%;
box-shadow:0 0 20px #25d366;
}

/* PARTICLES */

#particles{
position:fixed;
inset:0;
z-index:-1;
}

/* MOBILE */

@media(max-width:800px){

.contacto{grid-template-columns:1fr}

.hero h1{font-size:32px}

}

</style>
</head>

<body>

<div id="loader"></div>
<canvas id="particles"></canvas>

<a href="https://wa.me/541162660343" class="whatsapp">💬</a>

<header>
<h2>Rico HTML</h2>

<nav>
<a href="#inicio">Inicio</a>
<a href="#sobre">Sobre</a>
<a href="#servicios">Servicios</a>
<a href="#contacto">Contacto</a>
</nav>
</header>

<div class="hero" id="inicio">
<h1>Diseño Web Profesional</h1>
</div>

<section id="sobre">
<h2>Sobre Nosotros</h2>
<p>Creamos experiencias digitales premium.</p>
</section>

<section id="servicios">
<h2>Servicios</h2>

<div class="cards">
<div class="card"><img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085"><p style="padding:15px">Diseño Web</p></div>
<div class="card"><img src="https://images.unsplash.com/photo-1556155092-8707de31f9c4"><p style="padding:15px">SEO</p></div>
<div class="card"><img src="https://images.unsplash.com/photo-1521737604893-d14cc237f11d"><p style="padding:15px">Responsive</p></div>
</div>

</section>

<section id="contacto">
<h2>Contacto</h2>

<div class="contacto">

<div>
<p>📍 Quilmes</p>
<p>📞 +54 11 6266 0343</p>
<p>✉ agusrico18@gmail.com</p>
</div>

<form action="mailto:agusrico18@gmail.com">
<input placeholder="Nombre" required>
<input type="email" placeholder="Email" required>
<textarea placeholder="Mensaje"></textarea>
<button>Enviar</button>
</form>

</div>
</section>

<footer style="text-align:center;padding:20px">© 2026 Rico HTML</footer>

<script>

/* LOADER */
window.onload=()=>loader.style.display="none";

/* SCROLL */

const obs=new IntersectionObserver(e=>{
e.forEach(x=>x.isIntersecting&&x.target.classList.add("show"))
});

document.querySelectorAll("section").forEach(s=>obs.observe(s));

/* PARTICLES */

const c=document.getElementById("particles"),ctx=c.getContext("2d");
c.width=innerWidth;c.height=innerHeight;

let p=[];

for(let i=0;i<60;i++)
p.push({x:Math.random()*c.width,y:Math.random()*c.height,vx:1,vy:1});

function draw(){
ctx.clearRect(0,0,c.width,c.height);
p.forEach(o=>{
o.x+=o.vx;o.y+=o.vy;
if(o.x>c.width||o.x<0)o.vx*=-1;
if(o.y>c.height||o.y<0)o.vy*=-1;
ctx.fillStyle="#2aa8ff";
ctx.fillRect(o.x,o.y,2,2);
});
requestAnimationFrame(draw)
}
draw();

</script>

</body>
</html>
